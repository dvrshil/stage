<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stage</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud" class="hud">
      <div class="top">
        <div id="title" class="title">Stage</div>
        <div id="camera" class="chip"></div>
      </div>
      <div class="bottom">
        <div id="selection" class="panel hidden"></div>
        <div id="status" class="panel"></div>
        <div id="problems" class="panel problems hidden"></div>
      </div>
      <div id="help" class="panel help hidden">
        <div class="help-title">Keys</div>
        <div><kbd>C</kbd> next camera</div>
        <div><kbd>O</kbd> orbit view</div>
        <div><kbd>P</kbd> plan view</div>
        <div><kbd>V</kbd> walk (WASD, mouse to look, Esc to stop)</div>
        <div><kbd>L</kbd> room labels</div>
        <div>Click an item to see its id</div>
        <div><kbd>?</kbd> this list</div>
      </div>
      <div class="hint"><kbd>?</kbd> keys</div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  # Headless renders through the runner's Chrome. The goldens were made on a
  # developer machine, so a GPU-less runner may drift past the threshold;
  # this job reports but does not block until the goldens come from CI too.
  render:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:render
        env:
          STAGE_CHROMIUM: /usr/bin/google-chrome
